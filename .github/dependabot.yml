version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns:
          - laravel/*
      phpunit:
        patterns:
          - phpunit/*
          - sebastian/*
          - phar-io/*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      vite:
        patterns:
          - vite
          - laravel-vite-plugin
          - '@tailwindcss/*'
          - tailwindcss

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
