name: Feature request
description: Propose a concrete change to the site or repo
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should SmelterWorks Web do instead?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Pages, config keys, hosting flows, or assets this would touch.
    validations:
      required: true
