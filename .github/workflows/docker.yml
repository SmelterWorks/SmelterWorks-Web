# Pinned action SHAs. Update via Dependabot github-actions PRs, then refresh comments.
# actions/checkout@v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
# docker/setup-buildx-action@v3 -> 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
# docker/login-action@v3 -> c94ce9fb468520275223c153574b00df6fe4bcc9
# docker/metadata-action@v5 -> c299e40c65443455700f0fdfc63efafe5b349051
# docker/build-push-action@v6 -> 10e90e3645eae34f1e60eeb005ba3a3d33f178e8

name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - docker-compose.yml
      - docker-compose.coolify.yml
      - .dockerignore
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - resources/**
      - public/**
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - routes/**
      - artisan
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smelterworks/smelterworks-web

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_VERSION=${{ github.ref_name }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
