# Pinned action SHAs. Update via Dependabot github-actions PRs, then refresh comments.
# actions/checkout@v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
# actions/setup-node@v7.0.0 -> 820762786026740c76f36085b0efc47a31fe5020
# shivammathur/setup-php@v2 -> f3e473d116dcccaddc5834248c87452386958240
# ramsey/composer-install@v4.0.0 -> 65e4f84970763564f46a70b8a54b90d033b3bdda

name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, sqlite3, pdo_sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        env:
          APP_ENV: production
          APP_DEBUG: false
          APP_URL: http://127.0.0.1:8765

      - name: Update Lighthouse score badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run badges:lighthouse

      - name: Commit Lighthouse score badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/lighthouse.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update Lighthouse score badge"
          git push

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
