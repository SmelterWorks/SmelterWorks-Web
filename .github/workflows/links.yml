# Pinned action SHAs. Update via Dependabot github-actions PRs, then refresh comments.
# actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
# actions/cache@v4 -> 0057852bfaa89a56745cba8c7296529d2fc39830
# lycheeverse/lychee-action@v2 -> e7477775783ea5526144ba13e8db5eec57747ce8

name: Links

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: links-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    name: Dead link check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('.lycheeignore', '.github/workflows/links.yml', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'AGENTS.md', 'config/smelterworks.php') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 7d
            --include-mail=false
            --exclude-loopback
            --accept 200,403,429
            README.md
            CONTRIBUTING.md
            SECURITY.md
            AGENTS.md
            LICENSE
            config/smelterworks.php
            resources/views
