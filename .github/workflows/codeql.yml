# github/codeql-action@v4 -> 5595ccaf912efad79be6eef63a5619ff05969be3
# actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
          - php

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup PHP
        if: matrix.language == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, sqlite3, pdo_sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies
        if: matrix.language == 'php'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm ci

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}
