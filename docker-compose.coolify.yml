# Coolify compose for SmelterWorks Web.
# Use this file as the Coolify Docker Compose build pack.
# Image: ghcr.io/smelterworks/smelterworks-web (see .github/workflows/docker.yml).
# Proxy via SERVICE_URL_WEB_8080 (container listens on 8080). No host port publish.
# Set APP_KEY (full base64:... value) before deploy. IMAGE_TAG defaults to latest.
# APP_URL comes from SERVICE_URL_WEB and must be https://your.domain.
# Do not set user: on the service. Entrypoint chowns volumes then drops to app.

name: smelterworks-web

services:
  web:
    image: ghcr.io/smelterworks/smelterworks-web:${IMAGE_TAG:-latest}
    pull_policy: always
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - SERVICE_URL_WEB_8080
      - APP_URL=${SERVICE_URL_WEB}
      - APP_KEY=${APP_KEY:?}
      - APP_NAME=SmelterWorks
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - LOG_STACK=stderr
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/database.sqlite
      - SESSION_DRIVER=file
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - BROADCAST_CONNECTION=log
      - FILESYSTEM_DISK=local
      - MAIL_MAILER=log
      - SMELTERWORKS_FLUXER_URL=${SMELTERWORKS_FLUXER_URL:-}
      - SMELTERWORKS_GITHUB_URL=${SMELTERWORKS_GITHUB_URL:-https://github.com/SmelterWorks}
      - SMELTERWORKS_RELIC_REPO_URL=${SMELTERWORKS_RELIC_REPO_URL:-https://github.com/SmelterWorks/Relic-Launcher}
      - SMELTERWORKS_PANEL_URL=${SMELTERWORKS_PANEL_URL:-}
      - SMELTERWORKS_WIKI_URL=${SMELTERWORKS_WIKI_URL:-}
      - SMELTERWORKS_LEGAL_CONTACT=${SMELTERWORKS_LEGAL_CONTACT:-}
      - SMELTERWORKS_CONTACT_EMAIL=${SMELTERWORKS_CONTACT_EMAIL:-}
      - SMELTERWORKS_KOFI_URL=${SMELTERWORKS_KOFI_URL:-https://ko-fi.com/smelterworks}
      - SMELTERWORKS_RELIC_PREVIEW_URL=${SMELTERWORKS_RELIC_PREVIEW_URL:-}
      - SMELTERWORKS_BANNER_ENABLED=${SMELTERWORKS_BANNER_ENABLED:-false}
      - SMELTERWORKS_BANNER_MESSAGE=${SMELTERWORKS_BANNER_MESSAGE:-Website is under construction}
      - SMELTERWORKS_BANNER_BACKGROUND=${SMELTERWORKS_BANNER_BACKGROUND:-#b45309}
      - SMELTERWORKS_BANNER_COLOR=${SMELTERWORKS_BANNER_COLOR:-#ebe4d8}
      - SMELTERWORKS_BANNER_HREF=${SMELTERWORKS_BANNER_HREF:-}
      - SMELTERWORKS_BANNER_LINK_LABEL=${SMELTERWORKS_BANNER_LINK_LABEL:-}
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/lib/nginx:uid=65532,gid=65532,mode=0755,size=16m
    volumes:
      - app-storage:/var/www/html/storage
      - app-cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m

volumes:
  app-storage:
  app-cache:
