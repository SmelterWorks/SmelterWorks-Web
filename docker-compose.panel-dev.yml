# Local panel + smelterd stack for BYOS pairing tests.
# Usage: docker compose -f docker-compose.panel-dev.yml up --build
#
# Panel login: there is no default admin. Register the first account at http://localhost:8080/register
# (that user becomes the organization owner). Seeder credentials exist only after `php artisan db:seed`:
# test@example.com / password-password
#
# ALTCHA Sentinel (optional): http://localhost:8081 (default login root/root). Create an API key in the UI,
# then set PANEL_ALTCHA_DRIVER=sentinel, PANEL_ALTCHA_CHALLENGE_URL, and PANEL_ALTCHA_HMAC_KEY on panel.

services:
  panel:
    build:
      context: ./panel
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      PANEL_MODE: selfhost
      PANEL_STRIPE_ENABLED: "false"
      METRICS_ENABLED: "false"
      SENTRY_LARAVEL_DSN: ""
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      PANEL_DB_VALIDATE_ON_BOOT: "false"
      PANEL_ALTCHA_ENABLED: "true"
      PANEL_ALTCHA_DRIVER: standalone
    volumes:
      - panel-sqlite:/var/www/html/database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  altcha-sentinel:
    image: ghcr.io/altcha-org/sentinel:latest
    profiles:
      - altcha
    ports:
      - "8081:8080"
    volumes:
      - altcha-sentinel-data:/data

  smelterd:
    build:
      context: ./server-daemon
    depends_on:
      panel:
        condition: service_healthy
    environment:
      SMELTER_HUB_URL: http://panel:8080
      SMELTER_TOKEN: ${SMELTER_TOKEN:-}
      SMELTER_HUB_PUBLIC_KEY: ${SMELTER_HUB_PUBLIC_KEY:-}
      SMELTER_LOCAL_TOKEN: ${SMELTER_LOCAL_TOKEN:-local-dev-token}
    volumes:
      - smelter-data:/data
      - smelter-mods:/mods
      - smelter-backups:/backups
      - smelter-state:/var/lib/smelterd
      - smelter-run:/run
    restart: unless-stopped

volumes:
  panel-sqlite:
  altcha-sentinel-data:
  smelter-data:
  smelter-mods:
  smelter-backups:
  smelter-state:
  smelter-run:
